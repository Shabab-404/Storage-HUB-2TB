<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>তালা চাবি · 2TB Cloud Storage</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Hind+Siliguri:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f4ee;--surface:#fff;--surface2:#efe9dd;--text:#2c2b1d;--muted:#8b8772;--line:rgba(61,59,40,.12);--olive:#3d3b28;--accent:#c0794a;--btn:#3d3b28;--btn-t:#f5f1ea;--hero:#43412c;--shadow:0 22px 50px -26px rgba(61,59,40,.45)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2a1c;--surface:#363424;--surface2:#403e2b;--text:#f3efe6;--muted:#a9a58f;--line:rgba(255,255,255,.1);--btn:#f3efe6;--btn-t:#2b2a1c;--hero:#4a4830;--accent:#d9905f}}
:root[data-theme="dark"]{--bg:#2b2a1c;--surface:#363424;--surface2:#403e2b;--text:#f3efe6;--muted:#a9a58f;--line:rgba(255,255,255,.1);--btn:#f3efe6;--btn-t:#2b2a1c;--hero:#4a4830;--accent:#d9905f}
*{box-sizing:border-box;margin:0;padding:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:Manrope,'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.nav{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:20px;height:70px;flex-wrap:wrap}
.brand{font-weight:700;font-size:22px;letter-spacing:0;display:flex;align-items:center;gap:8px}
#nav{display:flex;gap:4px;margin:0 auto}
#nav a{padding:9px 16px;border-radius:99px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer}
#nav a.active{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.right{display:flex;gap:10px;align-items:center}
.search input{height:42px;width:150px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:0 16px;font:13px Manrope;outline:0}
.search input:focus{border-color:var(--accent)}
.ibtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:16px}
.pbtn{height:42px;padding:0 22px;border-radius:99px;border:0;background:var(--btn);color:var(--btn-t);font:600 13px Manrope}
.hero{margin-top:28px;border-radius:30px;background:var(--hero);color:#f3efe6;padding:38px 42px;box-shadow:var(--shadow);display:grid;grid-template-columns:1.4fr .6fr;gap:28px;align-items:center}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#b9b49a;margin-bottom:10px}
.big{font-weight:300;font-size:clamp(40px,6vw,72px);letter-spacing:-.04em;line-height:1}
.big small{font-size:.28em;color:#b9b49a;margin-left:8px;letter-spacing:0}
.hline{display:flex;gap:22px;margin:18px 0 14px;flex-wrap:wrap;color:#cfcab4;font-size:14px}.hline b{color:#fff}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.1);max-width:560px}
.stack i{display:block;height:100%;transition:width .8s}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.lg{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.1);font-size:12px}
.lg i{width:10px;height:10px;border-radius:50%}
.ring{position:relative;width:200px;height:200px;margin-left:auto}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-weight:400;font-size:24px;letter-spacing:-.02em}.ring .c span{font-size:12px;color:#b9b49a}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
.stat{padding:16px 20px;background:var(--surface);border:1px solid var(--line);border-radius:20px}
.stat b{display:block;font-size:22px;font-weight:600}.stat small{color:var(--muted);font-size:12px}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin:44px 0 6px;gap:12px;flex-wrap:wrap}
h2{font-weight:500;font-size:clamp(24px,3vw,36px);letter-spacing:-.03em}h2 em{font-style:normal;color:var(--accent)}
.day{margin:28px 0 12px;display:flex;gap:12px;align-items:baseline}.day h3{font-size:16px;font-weight:600}.day span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.ph{position:relative;aspect-ratio:1;border-radius:20px;overflow:hidden;cursor:pointer;background:var(--surface2);transition:.25s}
.ph:hover{transform:scale(1.03);box-shadow:var(--shadow)}
.ph img,.ph video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.ph .ov{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.4),transparent 40%,rgba(0,0,0,.5));opacity:0;transition:.2s}
.ph:hover .ov{opacity:1}
.ph .sel{position:absolute;top:10px;left:10px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;color:#fff;display:grid;place-items:center;font-size:13px;opacity:0;background:rgba(0,0,0,.25);z-index:2}
.ph:hover .sel,.ph.picked .sel{opacity:1}
.ph.picked{outline:3px solid var(--accent);outline-offset:-3px}
.ph.picked .sel{background:var(--accent);border-color:var(--accent)}
.ph .vid{position:absolute;top:10px;right:10px;font:600 11px Manrope;color:#fff;background:rgba(0,0,0,.55);padding:4px 10px;border-radius:99px}
.ph .fv{position:absolute;bottom:8px;left:10px;color:#fff;font-size:15px;text-shadow:0 1px 4px #000}
.empty{text-align:center;color:var(--muted);padding:80px 20px;line-height:1.8}
.empty button{margin-top:16px}
footer{margin-top:80px;padding:28px 0 46px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.selbar{position:fixed;left:50%;bottom:-100px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:8px;padding:10px 12px 10px 22px;border-radius:99px;background:var(--olive);color:#f3efe6;box-shadow:0 24px 60px -12px rgba(0,0,0,.55);transition:bottom .4s}
.selbar.show{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.selbar b{font-size:14px;margin-right:6px;white-space:nowrap}
.selbar button{border:1px solid rgba(255,255,255,.2);padding:9px 16px;border-radius:99px;font:600 13px Manrope;color:#f3efe6;background:transparent}
.selbar .pri{background:var(--accent);border-color:transparent}
.toast{position:fixed;top:84px;right:20px;z-index:200;padding:13px 22px;border-radius:99px;background:var(--olive);color:#f3efe6;font:500 14px Manrope;transform:translateX(140%);transition:.4s;max-width:80vw}
.toast.show{transform:none}
.drop{position:fixed;inset:0;z-index:150;background:rgba(61,59,40,.85);color:#fff;display:none;place-items:center;font-size:24px;font-weight:600}
.drop.on{display:grid}

/* viewer */
.lb{position:fixed;inset:0;z-index:100;background:rgba(24,23,12,.95);display:none;align-items:center;justify-content:center;padding:0}
.lb.open{display:flex}
.stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;user-select:none}
.stage.pseudo{position:fixed;inset:0;z-index:300;width:100vw;height:100vh}
.stage img,.stage video{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;background:#000}
.top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 30px;background:linear-gradient(rgba(0,0,0,.65),transparent);color:#fff;z-index:5;transition:opacity .3s}
.top .t{flex:1;min-width:0}.top b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top small{color:#c9c5ad;font-size:12px}
.vb{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:16px;display:grid;place-items:center;flex:none}
.vb:hover{background:rgba(255,255,255,.28)}
.nv{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:48px;height:48px;font-size:22px}.nv.p{left:16px}.nv.n{right:16px}
.ctl{position:absolute;left:0;right:0;bottom:0;padding:30px 18px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;z-index:5;transition:opacity .3s;display:none}
.ctl.on{display:block}
.row{display:flex;align-items:center;gap:10px;margin-top:8px}
.ctl .vb{width:38px;height:38px;font-size:14px;background:transparent}
.ctl .sp{flex:1}
.ctl .tm{font:500 12px Manrope;min-width:92px;color:#e6e1cb;font-variant-numeric:tabular-nums}
.ctl .spd{width:auto;padding:0 12px;border-radius:99px;font:600 12px Manrope}
input[type=range]{-webkit-appearance:none;appearance:none;height:5px;border-radius:99px;background:rgba(255,255,255,.28);outline:0;cursor:pointer;width:100%}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--accent)}
#vol{width:80px}
.idle .top,.idle .ctl,.idle .nv{opacity:0;pointer-events:none}
.idle{cursor:none}
.bigplay{position:absolute;z-index:4;width:78px;height:78px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:30px;display:none;place-items:center;pointer-events:none}
.bigplay.on{display:grid}

@media(max-width:1000px){.nav .wrap{height:auto;padding-top:10px;padding-bottom:10px}#nav{order:3;width:100%;overflow-x:auto;margin:0}.right{margin-left:auto}.hero{grid-template-columns:1fr}.ring{margin:0 auto}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.wrap{padding:0 14px}.hero{padding:28px 22px}.grid{grid-template-columns:repeat(2,1fr)}.search{display:none}#vol{display:none}.nv{display:none}}
</style>
</head>
<body>
<div class="nav"><div class="wrap">
  <div class="brand">☁️ তালা চাবি</div>
  <div id="nav"><a class="active" data-f="all">Photos</a><a data-f="fav">Favorites</a><a data-f="video">Videos</a><a data-f="trash">Trash</a></div>
  <div class="right">
    <div class="search"><input id="q" placeholder="Search files…"></div>
    <button class="ibtn" id="theme" title="Toggle theme">☾</button>
    <button class="pbtn" id="upBtn">＋ Upload</button>
  </div>
</div></div>

<div class="wrap">
  <div class="hero">
    <div>
      <div class="eyebrow">Cloud storage · 2 TB plan</div>
      <div class="big"><span id="usedBig">0 B</span><small>used of 2 TB</small></div>
      <div class="hline"><span><b id="free">2 TB</b> free</span><span><b id="pctTxt">0%</b> used</span></div>
      <div class="stack" id="stack"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="ring">
      <svg width="200" height="200" viewBox="0 0 230 230"><circle cx="115" cy="115" r="98" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="14"/><circle id="arc" cx="115" cy="115" r="98" fill="none" stroke="#d9905f" stroke-width="14" stroke-linecap="round" stroke-dasharray="615.75" stroke-dashoffset="615.75" style="transition:stroke-dashoffset 1s"/></svg>
      <div class="c"><b id="pct">0%</b><span>of 2 TB</span></div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><b id="nPh">0</b><small>Photos</small></div>
    <div class="stat"><b id="nVid">0</b><small>Videos</small></div>
    <div class="stat"><b id="nFav">0</b><small>Favorites</small></div>
    <div class="stat"><b id="nTr">0</b><small>In trash</small></div>
  </div>

  <div class="sec-head"><h2 id="secTitle">All <em>Photos</em></h2><button class="pbtn" id="emptyTrash" style="display:none">Empty trash</button></div>
  <div id="timeline"></div>

  <footer><span>© 2026 তালা চাবি · Private &amp; encrypted</span><span id="foot">2 TB Premium</span></footer>
</div>

<div class="selbar" id="selbar"><b id="selN">0 selected</b><span id="selBtns"></span><button id="clr">✕</button></div>

<div class="lb" id="lb">
  <div class="stage" id="stage">
    <div class="top"><div class="t"><b id="lbT"></b><small id="lbS"></small></div>
      <button class="vb" id="bFav" title="Favorite">☆</button>
      <button class="vb" id="bDl" title="Download">⬇</button>
      <button class="vb" id="bFs" title="Fullscreen (F)">⛶</button>
      <button class="vb" id="bX" title="Close">✕</button></div>
    <button class="vb nv p" id="bP">‹</button><button class="vb nv n" id="bN">›</button>
    <div id="media" style="position:absolute;inset:0"></div>
    <div class="bigplay" id="bigplay">▶</div>
    <div class="ctl" id="ctl">
      <input type="range" id="seek" min="0" max="1000" value="0" step="1">
      <div class="row">
        <button class="vb" id="cPlay">▶</button>
        <button class="vb" id="cBack" title="Back 10s">⟲</button>
        <button class="vb" id="cFwd" title="Forward 10s">⟳</button>
        <span class="tm" id="tm">0:00 / 0:00</span><span class="sp"></span>
        <button class="vb" id="cMute">🔊</button><input type="range" id="vol" min="0" max="1" step=".05" value="1">
        <button class="vb spd" id="cSpd">1×</button>
        <button class="vb" id="cPip" title="Picture in picture">⧉</button>
        <button class="vb" id="cFs" title="Fullscreen">⛶</button>
      </div>
    </div>
  </div>
</div>
<div class="drop" id="drop">Drop files to upload to your vault</div>
<input type="file" id="file" multiple accept="image/*,video/*" hidden>
<div class="toast" id="toast"></div>

<script>
const CAP=2*1024**4; // 2 TB plan
const $=s=>document.querySelector(s);
const files=[]; let filter='all',query='',picked=new Set(),view=[],cur=0;

/* ---------- storage (IndexedDB, persists across visits) ---------- */
let db=null;
const idb=new Promise(res=>{try{const r=indexedDB.open('nimbus-vault',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>res()}catch(e){res()}});
const tx=(m,fn)=>new Promise(res=>{if(!db)return res();try{const t=db.transaction('files',m),s=t.objectStore('files');const r=fn(s);t.oncomplete=()=>res(r&&r.result);t.onerror=t.onabort=()=>res()}catch(e){res()}});
const dbPut=f=>tx('readwrite',s=>s.put({id:f.id,name:f.name,type:f.type,size:f.size,added:f.added,fav:f.fav,trash:f.trash,vid:f.vid,blob:f.blob}));
const dbDel=id=>tx('readwrite',s=>s.delete(id));
const dbAll=()=>tx('readonly',s=>s.getAll());

/* ---------- helpers ---------- */
function fmt(b){if(b<1024)return b+' B';const u=['KB','MB','GB','TB'];let i=-1;do{b/=1024;i++}while(b>=1024&&i<3);return b.toFixed(b>=100?0:b>=10?1:2)+' '+u[i]}
function pctFmt(b){if(!b)return '0%';const p=b/CAP*100;if(p>=1)return p.toFixed(2)+'%';if(p<0.000001)return '<0.000001%';return p.toFixed(6).replace(/0+$/,'')+'%'}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}
const tfmt=s=>{s=Math.max(0,Math.floor(s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0');return h?h+':'+String(m).padStart(2,'0')+':'+x:m+':'+x};
function dayLabel(t){const d=new Date(t),n=new Date(),a=new Date(d.getFullYear(),d.getMonth(),d.getDate()),b=new Date(n.getFullYear(),n.getMonth(),n.getDate()),diff=Math.round((b-a)/864e5);if(diff===0)return 'Today';if(diff===1)return 'Yesterday';return d.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric',year:d.getFullYear()!==n.getFullYear()?'numeric':undefined})}
const isVid=f=>f.type.startsWith('video')||/\.(mp4|mov|m4v|webm|mkv|avi|3gp|ogv)$/i.test(f.name);
const isImg=f=>f.type.startsWith('image')||/\.(jpe?g|png|gif|webp|heic|avif|bmp|svg)$/i.test(f.name);

/* ---------- storage meter (exact, from real file sizes) ---------- */
function meter(){
  const live=files.filter(f=>!f.trash);
  const sum=a=>a.reduce((s,f)=>s+f.size,0);
  const ph=sum(files.filter(f=>!f.vid&&!f.trash)),vi=sum(files.filter(f=>f.vid&&!f.trash)),tr=sum(files.filter(f=>f.trash));
  const used=ph+vi+tr;
  $('#usedBig').textContent=fmt(used);
  $('#free').textContent=fmt(CAP-used);
  $('#pctTxt').textContent=pctFmt(used);
  $('#pct').textContent=pctFmt(used);
  const pv=Math.min(1,used/CAP);
  $('#arc').style.strokeDashoffset=615.75*(1-pv);
  const seg=[['Photos',ph,'#d9905f'],['Videos',vi,'#a9b07a'],['Trash',tr,'#e6cfae']];
  $('#stack').innerHTML=seg.map(s=>`<i style="background:${s[2]};width:${s[1]?Math.max(s[1]/CAP*100,.4):0}%"></i>`).join('');
  $('#legend').innerHTML=seg.map(s=>`<div class="lg"><i style="background:${s[2]}"></i>${s[0]} · ${fmt(s[1])} · ${pctFmt(s[1])}</div>`).join('');
  $('#nPh').textContent=live.filter(f=>!f.vid).length;
  $('#nVid').textContent=live.filter(f=>f.vid).length;
  $('#nFav').textContent=live.filter(f=>f.fav).length;
  $('#nTr').textContent=files.filter(f=>f.trash).length;
}

/* ---------- grid ---------- */
function render(){
  const q=query.toLowerCase();
  view=files.filter(f=>(filter==='trash'?f.trash:!f.trash)&&(filter!=='video'||f.vid)&&(filter!=='fav'||f.fav)&&(!q||f.name.toLowerCase().includes(q))).sort((a,b)=>b.added-a.added);
  const by={};view.forEach(f=>(by[dayLabel(f.added)]=by[dayLabel(f.added)]||[]).push(f));
  let h='';
  for(const d in by){
    h+=`<div class="day"><h3>${d}</h3><span>${by[d].length} item${by[d].length>1?'s':''}</span></div><div class="grid">`;
    by[d].forEach(f=>{h+=`<div class="ph ${picked.has(f.id)?'picked':''}" data-id="${f.id}">${f.vid?`<video src="${f.url}#t=0.1" muted playsinline preload="metadata"></video>`:`<img src="${f.url}" alt="" loading="lazy">`}<div class="ov"></div><div class="sel">✓</div>${f.vid?`<span class="vid">▶ ${f.dur||'video'}</span>`:''}${f.fav?'<span class="fv">★</span>':''}</div>`});
    h+='</div>';
  }
  const msgs={all:'Your vault is empty.<br>Upload photos and videos to back them up.',fav:'No favorites yet.<br>Open a photo and tap the star.',video:'No videos uploaded yet.',trash:'Trash is empty.'};
  $('#timeline').innerHTML=h||`<div class="empty">${msgs[filter]}${filter==='all'&&!q?'<br><button class="pbtn" onclick="$(\'#file\').click()">＋ Upload files</button>':''}</div>`;
  $('#emptyTrash').style.display=filter==='trash'&&view.length?'':'none';
  meter();updSel();
}
function updSel(){
  const n=picked.size;$('#selN').textContent=n+' selected';$('#selbar').classList.toggle('show',n>0);
  $('#selBtns').innerHTML=filter==='trash'?'<button onclick="act(\'restore\')">Restore</button><button class="pri" onclick="act(\'purge\')">Delete forever</button>':'<button onclick="act(\'dl\')">Download</button><button onclick="act(\'fav\')">Favorite</button><button class="pri" onclick="act(\'trash\')">Delete</button>';
}
async function act(a){
  const sel=files.filter(f=>picked.has(f.id));
  if(a==='dl')sel.forEach(download);
  if(a==='fav'){const on=sel.some(f=>!f.fav);for(const f of sel){f.fav=on;await dbPut(f)}toast(on?'Added to favorites':'Removed from favorites')}
  if(a==='trash'){for(const f of sel){f.trash=true;await dbPut(f)}toast(sel.length+' moved to trash')}
  if(a==='restore'){for(const f of sel){f.trash=false;await dbPut(f)}toast(sel.length+' restored')}
  if(a==='purge')await purge(sel);
  picked.clear();render();
}
async function purge(list){for(const f of list){URL.revokeObjectURL(f.url);files.splice(files.indexOf(f),1);await dbDel(f.id)}toast('Deleted permanently · storage freed')}
function download(f){const a=document.createElement('a');a.href=f.url;a.download=f.name;document.body.appendChild(a);a.click();a.remove()}

$('#timeline').addEventListener('click',e=>{
  const el=e.target.closest('.ph');if(!el)return;const id=+el.dataset.id;
  if(e.target.closest('.sel')||picked.size){picked.has(id)?picked.delete(id):picked.add(id);el.classList.toggle('picked');updSel();return}
  cur=view.findIndex(f=>f.id===id);openLb();
});
$('#clr').onclick=()=>{picked.clear();render()};
$('#emptyTrash').onclick=async()=>{await purge(files.filter(f=>f.trash));render()};
$('#nav').addEventListener('click',e=>{
  const a=e.target.closest('a');if(!a)return;
  document.querySelectorAll('#nav a').forEach(x=>x.classList.remove('active'));a.classList.add('active');
  filter=a.dataset.f;picked.clear();
  const t={all:'All Photos',fav:'Your Favorites',video:'Your Videos',trash:'Trash'}[filter].split(' '),l=t.pop();
  $('#secTitle').innerHTML=(t.length?t.join(' ')+' ':'')+'<em>'+l+'</em>';render();
});
$('#q').addEventListener('input',e=>{query=e.target.value;render()});
$('#theme').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'};

/* ---------- upload ---------- */
$('#upBtn').onclick=()=>$('#file').click();
$('#file').addEventListener('change',e=>{handle([...e.target.files]);e.target.value=''});
let dragN=0;
addEventListener('dragenter',e=>{e.preventDefault();dragN++;$('#drop').classList.add('on')});
addEventListener('dragleave',()=>{if(--dragN<=0){dragN=0;$('#drop').classList.remove('on')}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dragN=0;$('#drop').classList.remove('on');handle([...e.dataTransfer.files])});
function vidDur(url){return new Promise(r=>{const v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>r(tfmt(v.duration));v.onerror=()=>r(null);setTimeout(()=>r(null),4000);v.src=url})}
async function handle(list){
  list=list.filter(f=>isVid(f)||isImg(f));
  if(!list.length){toast('Please choose photo or video files');return}
  document.querySelector('#nav a[data-f=all]').click();
  let ok=0,skip=0,i=0;
  for(const file of list){
    i++;
    const used=files.reduce((s,f)=>s+f.size,0);
    if(used+file.size>CAP){skip++;continue}
    toast(`Uploading ${i} of ${list.length}…`);
    const vid=isVid(file),url=URL.createObjectURL(file);
    const f={id:Date.now()*1000+Math.floor(Math.random()*1000),name:file.name,type:file.type,size:file.size,added:Date.now(),fav:false,trash:false,vid,blob:file,url,dur:vid?await vidDur(url):null};
    files.push(f);await dbPut(f);ok++;render();
  }
  toast(skip?`Uploaded ${ok} · ${skip} skipped (storage full)`:`Uploaded ${ok} file${ok>1?'s':''} · ${fmt(list.reduce((s,f)=>s+f.size,0))}`);
}

/* ---------- viewer & player ---------- */
const stage=$('#stage'),lb=$('#lb');let vEl=null,idleT;
function openLb(){
  const f=view[cur];if(!f)return;
  const m=$('#media');m.innerHTML='';vEl=null;
  $('#ctl').classList.toggle('on',f.vid);
  if(f.vid){
    vEl=document.createElement('video');vEl.src=f.url;vEl.playsInline=true;vEl.autoplay=true;vEl.preload='auto';
    vEl.addEventListener('timeupdate',tick);vEl.addEventListener('loadedmetadata',tick);vEl.addEventListener('play',pstate);vEl.addEventListener('pause',pstate);vEl.addEventListener('volumechange',vstate);vEl.addEventListener('ended',pstate);
    vEl.addEventListener('click',()=>vEl.paused?vEl.play():vEl.pause());
    vEl.addEventListener('dblclick',toggleFs);
    m.appendChild(vEl);vEl.play().catch(()=>{});
    $('#cSpd').textContent='1×';pstate();vstate();tick();
  }else{const i=document.createElement('img');i.src=f.url;i.alt=f.name;i.addEventListener('dblclick',toggleFs);m.appendChild(i)}
  $('#lbT').textContent=f.name;$('#lbS').textContent=`${dayLabel(f.added)} · ${fmt(f.size)}${f.vid?' · Video':''}`;
  $('#bFav').textContent=f.fav?'★':'☆';
  $('#bP').style.display=$('#bN').style.display=view.length>1?'':'none';
  lb.classList.add('open');wake();
}
function closeLb(){
  if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);
  stage.classList.remove('pseudo');if(vEl){vEl.pause();vEl.removeAttribute('src');vEl.load()}
  $('#media').innerHTML='';vEl=null;lb.classList.remove('open');
}
function step(d){if(!view.length)return;cur=(cur+d+view.length)%view.length;openLb()}
function tick(){if(!vEl)return;const d=vEl.duration||0;$('#seek').value=d?vEl.currentTime/d*1000:0;$('#tm').textContent=tfmt(vEl.currentTime)+' / '+tfmt(d)}
function pstate(){if(!vEl)return;$('#cPlay').textContent=vEl.paused?'▶':'⏸';$('#bigplay').classList.toggle('on',vEl.paused&&!vEl.ended&&vEl.currentTime>0)}
function vstate(){if(!vEl)return;$('#cMute').textContent=vEl.muted||vEl.volume===0?'🔇':'🔊';$('#vol').value=vEl.muted?0:vEl.volume}
$('#seek').addEventListener('input',e=>{if(vEl&&vEl.duration)vEl.currentTime=e.target.value/1000*vEl.duration});
$('#vol').addEventListener('input',e=>{if(vEl){vEl.volume=+e.target.value;vEl.muted=vEl.volume===0}});
$('#cPlay').onclick=()=>{if(vEl)vEl.paused?vEl.play():vEl.pause()};
$('#cBack').onclick=()=>{if(vEl)vEl.currentTime=Math.max(0,vEl.currentTime-10)};
$('#cFwd').onclick=()=>{if(vEl)vEl.currentTime=Math.min(vEl.duration||0,vEl.currentTime+10)};
$('#cMute').onclick=()=>{if(vEl)vEl.muted=!vEl.muted};
const speeds=[1,1.25,1.5,2,.5,.75];
$('#cSpd').onclick=()=>{if(!vEl)return;const i=(speeds.indexOf(vEl.playbackRate)+1)%speeds.length;vEl.playbackRate=speeds[i];$('#cSpd').textContent=speeds[i]+'×'};
$('#cPip').onclick=()=>{if(vEl&&document.pictureInPictureEnabled){document.pictureInPictureElement?document.exitPictureInPicture():vEl.requestPictureInPicture().catch(()=>toast('Picture in picture unavailable'))}else toast('Picture in picture unavailable')};
async function toggleFs(){
  const d=document;
  if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);return}
  if(stage.classList.contains('pseudo')){stage.classList.remove('pseudo');return}
  const rq=stage.requestFullscreen||stage.webkitRequestFullscreen;
  try{if(!rq)throw 0;await rq.call(stage)}
  catch(e){
    if(vEl&&vEl.webkitEnterFullscreen){try{vEl.webkitEnterFullscreen();return}catch(_){}}
    stage.classList.add('pseudo'); // fallback: fill the whole window
  }
}
$('#bFs').onclick=$('#cFs').onclick=toggleFs;
$('#bX').onclick=closeLb;$('#bP').onclick=()=>step(-1);$('#bN').onclick=()=>step(1);
$('#bDl').onclick=()=>download(view[cur]);
$('#bFav').onclick=async()=>{const f=view[cur];f.fav=!f.fav;await dbPut(f);$('#bFav').textContent=f.fav?'★':'☆';meter()};
function wake(){stage.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>{if(!vEl||!vEl.paused)stage.classList.add('idle')},2800)}
stage.addEventListener('mousemove',wake);stage.addEventListener('touchstart',wake,{passive:true});
addEventListener('keydown',e=>{
  if(!lb.classList.contains('open'))return;wake();
  const k=e.key;
  if(k==='Escape'){stage.classList.contains('pseudo')?stage.classList.remove('pseudo'):closeLb()}
  else if(k==='ArrowRight'){e.shiftKey||!vEl?step(1):vEl.currentTime+=5}
  else if(k==='ArrowLeft'){e.shiftKey||!vEl?step(-1):vEl.currentTime-=5}
  else if(k==='f'||k==='F')toggleFs();
  else if(vEl&&(k===' '||k==='k')){e.preventDefault();vEl.paused?vEl.play():vEl.pause()}
  else if(vEl&&(k==='m'||k==='M'))vEl.muted=!vEl.muted;
  else if(vEl&&k==='ArrowUp'){e.preventDefault();vEl.volume=Math.min(1,vEl.volume+.1)}
  else if(vEl&&k==='ArrowDown'){e.preventDefault();vEl.volume=Math.max(0,vEl.volume-.1)}
});

/* ---------- boot: load previously uploaded files ---------- */
(async()=>{
  await idb;const saved=(await dbAll())||[];
  for(const r of saved){r.url=URL.createObjectURL(r.blob);r.dur=null;files.push(r)}
  render();
  for(const f of files.filter(f=>f.vid))vidDur(f.url).then(d=>{f.dur=d;if(d)render()});
  if(!db)$('#foot').textContent='Private mode: files won’t persist after closing';
})();
</script>
</body>
</html>
